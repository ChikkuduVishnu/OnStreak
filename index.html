<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnStreak</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">

        <header class="header">
            <h1>OnStreak</h1>
            <p>Stay Organized. Stay Consistent</p>
        </header>

        <section class="streak-section">

            <div class="streak-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M493.7 .9l-194.2 74.7 2.3-29.3c1-12.8-12.8-21.5-24-15.1L101.3 133.4C38.6 169.7 0 236.6 0 309 0 421.1 90.9 512 203 512 275.4 512 342.3 473.4 378.6 410.7L480.8 234.3c6.5-11.1-2.2-25-15.1-24l-29.3 2.3 74.7-194.2c.6-1.5 .9-3.2 .9-4.8 0-7.5-6-13.5-13.5-13.5-1.7 0-3.3 .3-4.8 .9zM192 192a128 128 0 1 1 0 256 128 128 0 1 1 0-256zm0 96a32 32 0 1 0 -64 0 32 32 0 1 0 64 0zm16 96a16 16 0 1 0 0-32 16 16 0 1 0 0 32z"/></svg>
            </div>
            <h2>7 Day Streak</h2>
            <p>Keep going! Don't break the chain.</p>
        </section>

        <section class="weekly-streak">
            <h3>This Week</h3>

            <div class="days">

                <div class="day">
                    <span>Mon</span>
                    <span class="day-status">✅</span>
                </div>

                <div class="day">
                    <span>Tue</span>
                    <span class="day-status">✅</span>
                </div>

                <div class="day">
                    <span>Wed</span>
                    <span class="day-status">✅</span>
                </div>

                <div class="day">
                    <span>Thu</span>
                    <span class="day-status">✅</span>
                </div>

                <div class="day">
                    <span>Fri</span>
                    <span class="day-status">✅</span>
                </div>

                <div class="day">
                    <span>Sat</span>
                    <span class="day-status">✅</span>
                </div>

                <div class="day">
                    <span>Sun</span>
                    <span class="day-status">✅</span>
                </div>

            </div>
        </section>

        <section class="tasks-section">
            <h2>Today's Tasks</h2>

            <div class="task-input">
                <input 
                type="text"
                id="taskInput"
                placeholder="what do you want to do?"
                >
                <button id="addButton">Add Task</button>
            </div>

            <ul id="task-list"></ul>

        </section>

        <section class="statistics">

            <div class="stat-card">
                <h3 id="totalTasks">0</h3>
                <p>Total Tasks</p>
            </div>

            <div class="stat-card">
                <h3 id="completedTasks">0</h3>
                <p>Completed Tasks</p>
            </div>

            <div class="stat-card">
                <h3 id="pendingTasks">0</h3>
                <p>Pending Tasks</p>
            </div>

        </section>

    </div>
    

</body>
</html>
